<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        figure {
            border: 2px solid rgba(0, 0, 0, 0.098);
            max-width: 250px;
            padding: 30px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.098);
        }
        img {
            height: 100%;
            width: 100%;
        }
        figcaption {
            font-family: Verdana, Geneva, sans-serif;
            font-style: italic;
            font-weight: 800;
            font-size: 0.9em;
            text-align: center;
        }
    </style>
</head>
<body>
    <figure>
        <img src="pirikito.jpg" alt="imagem de pirikito sorrindo" height="500" widht="500">
        <figcaption>Imagem de Pirikito Sorrindo</figcaption>
    </figure>
</body>
</html>
